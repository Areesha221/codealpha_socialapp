<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SocialApp - Share Moments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📱</text></svg>">
  </head>
  <body class="instagram-theme">
    <div class="instagram-layout">
      <!-- LEFT SIDEBAR - ICONS ONLY -->
      <nav class="sidebar-navigation">
        <div class="sidebar-inner">
          <a href="#" class="logo" onclick="navigate('feed')">
            <div class="logo-icon"><i class="bi bi-camera-fill"></i></div>
            <span class="logo-text">SocialApp</span>
          </a>

          <ul class="nav-menu">
            <!-- Desktop Only Items -->
            <li class="nav-item desktop-only active" onclick="navigate('feed')">
              <i class="bi bi-house-door"></i>
              <span>Home</span>
            </li>
            <li class="nav-item desktop-only" onclick="navigate('search')">
              <i class="bi bi-search"></i>
              <span>Search</span>
            </li>
            <li class="nav-item desktop-only" onclick="navigate('explore')">
              <i class="bi bi-compass"></i>
              <span>Explore</span>
            </li>
            <li class="nav-item desktop-only" onclick="navigate('reels')">
              <i class="bi bi-play-circle"></i>
              <span>Reels</span>
            </li>
            <li class="nav-item desktop-only" onclick="navigate('messages')">
              <i class="bi bi-chat-dots"></i>
              <span>Messages</span>
            </li>
            <li class="nav-item desktop-only" onclick="navigate('notifications')">
              <i class="bi bi-heart"></i>
              <span>Notifications</span>
            </li>
            <li class="nav-item desktop-only" onclick="navigate('create')">
              <i class="bi bi-plus-square"></i>
              <span>Create</span>
            </li>
            <li class="nav-item desktop-only" onclick="navigate('profile')">
              <img src="" alt="Profile" class="nav-profile-img" id="nav-profile-img">
              <span>Profile</span>
            </li>
            <li class="nav-item desktop-only" onclick="showMoreMenu()">
              <i class="bi bi-list"></i>
              <span>More</span>
            </li>

            <!-- Mobile Only Items (5 icons) -->
            <li class="nav-item mobile-only" onclick="navigate('feed')">
              <i class="bi bi-house-door"></i>
            </li>
            <li class="nav-item mobile-only" onclick="navigate('search')">
              <i class="bi bi-search"></i>
            </li>
            <li class="nav-item mobile-only" onclick="navigate('reels')">
              <i class="bi bi-play-circle"></i>
            </li>
            <li class="nav-item mobile-only" onclick="navigate('messages')">
              <i class="bi bi-chat-dots"></i>
            </li>
            <li class="nav-item mobile-only" onclick="navigate('profile')">
              <img src="" alt="Profile" class="nav-profile-img" id="nav-profile-img-mobile">
            </li>
          </ul>
        </div>
      </nav>

      <!-- MAIN CONTENT -->
      <main class="main-content" id="main-content">
        <div class="stories-container" id="stories-section">
          <div class="stories-wrapper">
            <div class="story-item create-story" onclick="showStoryCreationModal()">
              <div class="story-ring">
                <div class="story-plus"><i class="bi bi-plus-lg"></i></div>
              </div>
              <span class="story-username">Your story</span>
            </div>
            <div id="stories-list"></div>
          </div>
        </div>

        <div class="feed-container" id="feed-content"></div>
      </main>

      <!-- RIGHT SIDEBAR -->
      <aside class="right-sidebar" id="right-sidebar">
        <div class="user-profile-card">
          <div class="profile-info">
            <img src="" alt="Profile" class="profile-avatar" id="sidebar-profile-img">
            <div class="profile-details">
              <div class="username" id="sidebar-username"></div>
              <div class="full-name" id="sidebar-fullname"></div>
            </div>
          </div>
          <button class="switch-btn" onclick="showMoreMenu()">Switch</button>
        </div>

        <div class="suggestions-section">
          <div class="section-header">
            <span>Suggested for you</span>
            <a href="#" class="see-all" onclick="window.showAllSuggestions(); return false;">See all</a>
          </div>
          <div id="suggestions-list"></div>
        </div>

        <div class="footer-links">
          <a href="#">About</a> • <a href="#">Help</a> • <a href="#">Press</a> •
          <a href="#">API</a> • <a href="#">Jobs</a> • <a href="#">Privacy</a> •
          <a href="#">Terms</a>
        </div>
        <div class="copyright">© 2026 SOCIALAPP FROM YOUR INTERNSHIP</div>
      </aside>
    </div>

    <!-- Toast -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1050;">
      <div id="toast" class="toast" role="alert">
        <div class="toast-header">
          <strong class="me-auto" id="toast-title">Notification</strong>
          <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
        </div>
        <div class="toast-body" id="toast-body"></div>
      </div>
    </div>
    
    <!-- SCRIPTS: app.js MUST be loaded BEFORE profile.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/stories.js"></script>
    <script src="js/feed.js"></script>
    <script src="js/messages.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/explore.js"></script>
    <script src="js/app.js"></script>
    <script src="js/profile.js"></script> 
  </body>
</html>
